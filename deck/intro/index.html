  <style>
    /* the password screen in front of the encrypted deck, in the site's paper and ink */
    :root { --bg: #F7F6F3; --ink: #111110; --muted: #5C5B57; --faint: #8F8D87; --rule-strong: #CBC8BF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0E0E0D; --ink: #EDEBE6; --muted: #A5A39D; --faint: #74726D; --rule-strong: #3B3A37; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--ink); font: 16px/1.6 'Geist', ui-sans-serif, system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; padding: 32px; }
    .logo svg { display: block; width: 185px; height: auto; }
    form { align-self: center; justify-self: center; width: min(100%, 360px); display: grid; gap: 16px; }
    h1 { font-size: 1.75rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
    p { color: var(--muted); }
    .row { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border: 1px solid var(--rule-strong); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; }
    input:focus { outline: none; border-color: var(--ink); }
    button { height: 44px; padding: 0 24px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--bg); font-family: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .hint { min-height: 1.5em; font-size: 0.875rem; }
    .hint.err { color: #B42318; }
    footer { font: 0.75rem 'Geist Mono', ui-monospace, monospace; color: var(--faint); }
  </style>

    const es = /^(es|ca|gl|eu)\b/i.test(navigator.language || '') || new URLSearchParams(location.search).get('lang') === 'es';
    if (es) { document.documentElement.lang = 'es'; document.querySelectorAll('[data-es]').forEach(el => { el.textContent = el.dataset.es; }); }
    const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const subtle = crypto.subtle;
    async function reveal(key) {
      const plain = await subtle.decrypt({ name: 'AES-GCM', iv: bytes(SEALED.iv) }, key, bytes(SEALED.data));
      try { sessionStorage.setItem('deck-key', btoa(String.fromCharCode(...new Uint8Array(await subtle.exportKey('raw', key))))); } catch (e) { /* no storage: ask again next time */ }

      // decrypted page would be added under this one instead of replacing it: wait for load
      if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
      document.open(); document.write(new TextDecoder().decode(plain)); document.close();
    }
    async function keyFrom(password) {
      const base = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SEALED.salt), iterations: SEALED.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);

    const hint = document.getElementById('hint'), go = document.getElementById('go');
    document.getElementById('f').addEventListener('submit', async e => {

      go.disabled = true; hint.className = 'hint'; hint.textContent = es ? 'Abriendo…' : 'Opening…';

      catch (err) { go.disabled = false; hint.className = 'hint err'; hint.textContent = es ? 'Contraseña incorrecta.' : 'Wrong password.'; }

      try { saved = sessionStorage.getItem('deck-key'); } catch (e) { /* no storage */ }
      if (!saved) return;
      try { await reveal(await subtle.importKey('raw', bytes(saved), 'AES-GCM', true, ['decrypt'])); }
